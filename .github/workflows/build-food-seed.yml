name: Build food seed

on:
  workflow_dispatch:

concurrency:
  group: food-seed-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-food-seed:
    name: Build and publish food seed
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check runner storage before cleanup
        run: df -h /

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check runner storage after cleanup
        run: df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run type-check

      - name: Download source inputs
        run: npm run download:inputs

      - name: Resolve release metadata
        id: release_metadata
        run: |
          echo "run_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_OUTPUT"
          echo "verified=false" >> "$GITHUB_OUTPUT"

      - name: Build food seed artifacts
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          FOOD_SEED_RUN_AT: ${{ steps.release_metadata.outputs.run_at }}
          FOOD_SEED_VERIFIED: ${{ steps.release_metadata.outputs.verified }}
        run: npm run build:food-seed

      - name: Validate food seed artifacts
        run: npm run validate:food-seed

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-seed-validation-report
          path: |
            generated/food-seed/foods.validation.json
            generated/food-seed/foods.validation.md
          if-no-files-found: warn

      - name: Check runner storage
        run: df -h .

      - name: Resolve release tag
        id: release_tag
        env:
          FOOD_SEED_RUN_AT: ${{ steps.release_metadata.outputs.run_at }}
          FOOD_SEED_VERIFIED: ${{ steps.release_metadata.outputs.verified }}
        run: echo "tag=$(npm run --silent release:tag)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: npm run --silent release:notes > release-notes.md

      - name: Update version index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .release-index
          gh release download food-seed-index \
            --pattern foods.versions.json \
            --dir .release-index || true
          npm run --silent release:index -- \
            generated/food-seed/foods.manifest.json \
            generated/food-seed/foods.seed.json.gz \
            .release-index/foods.versions.json \
            generated/food-seed/foods.versions.json \
            "$GITHUB_REPOSITORY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          shopt -s nullglob
          release_assets=(
            generated/food-seed/foods.seed.json.gz
            generated/food-seed/foods.manifest.json
            generated/food-seed/foods.versions.json
            generated/food-seed/foods.qa.json
            generated/food-seed/foods.validation.json
            generated/food-seed/foods.validation.md
            generated/food-seed/foods-*.branded.json.gz
          )

          if ((${#release_assets[@]} < 5)); then
            echo "Expected core artifacts plus at least one branded country artifact."
            find generated/food-seed -maxdepth 1 -type f -print
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            "${release_assets[@]}"

      - name: Publish stable version index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view food-seed-index >/dev/null 2>&1; then
            gh release upload food-seed-index \
              --clobber \
              generated/food-seed/foods.versions.json
          else
            gh release create food-seed-index \
              --title "Food seed version index" \
              --notes "Machine-readable index. Only entries with verified=true are eligible as defaults." \
              generated/food-seed/foods.versions.json
          fi
