name: Build food seed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-food-seed:
    name: Build and publish food seed
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check runner storage before cleanup
        run: df -h /

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check runner storage after cleanup
        run: df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run type-check

      - name: Download source inputs
        run: npm run download:inputs

      - name: Build food seed artifacts
        run: npm run build:food-seed

      - name: Check runner storage
        run: df -h .

      - name: Resolve release tag
        id: release_tag
        run: echo "tag=$(npm run --silent release:tag)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: npm run --silent release:notes > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          shopt -s nullglob
          release_assets=(
            generated/food-seed/foods.seed.json
            generated/food-seed/foods.manifest.json
            generated/food-seed/foods.qa.json
            generated/food-seed/foods-*.branded.json
          )

          if ((${#release_assets[@]} < 4)); then
            echo "Expected core artifacts plus at least one branded country artifact."
            find generated/food-seed -maxdepth 1 -type f -print
            exit 1
          fi

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            "${release_assets[@]}"
